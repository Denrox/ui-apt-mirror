# Per-client rate of public cheatsheet searches (cheatsheets.mirror.intra.conf).
# The app runs two public searches at once and a heavy one takes about half a
# second, so a client searching once a second leaves room for others, and a
# flood beyond that never reaches the app.
limit_req_zone $binary_remote_addr zone=cheatsheets_search:1m rate=1r/s;
