# Per-client rate of public cheatsheet searches (cheatsheets.mirror.intra.conf).
# The app runs two public searches at once and a heavy one takes about half a
# second, so a client searching once a second leaves room for others, and a
# flood beyond that never reaches the app.
#
# Some addresses are shared by many clients: the Docker gateway (docker-proxy
# connects every IPv6 client and every client on the Docker host from there)
# and loopback. They are limited in a zone of their own, at a rate a few people
# searching at once stay under; the app caps the places they take in its queue.
# render-sites.sh writes the gateway to shared-clients.geo at start.
geo $cheatsheets_search_shared {
    default 0;
    127.0.0.0/8 1;
    include /etc/nginx/conf.d/shared-clients.geo;
}
map $cheatsheets_search_shared $cheatsheets_search_client {
    0 $binary_remote_addr;
    default "";
}
map $cheatsheets_search_shared $cheatsheets_search_shared_client {
    1 $binary_remote_addr;
    default "";
}
limit_req_zone $cheatsheets_search_client zone=cheatsheets_search:1m rate=1r/s;
limit_req_zone $cheatsheets_search_shared_client zone=cheatsheets_search_shared:1m rate=5r/s;
