server {
    listen 80 default_server;
    server_name mirror.intra;

    add_header Access-Control-Allow-Origin * always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Serve apt-mirror files
    location / {
        alias /var/spool/apt-mirror/mirror/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        
        # Cache static files
        location ~* \.(deb|dsc|tar\.gz|tar\.xz|tar\.bz2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin *;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }
    }

    # Repository signing keys, so clients need only this host
    location ^~ /api/pubkey/ {
        limit_except GET { deny all; }
        proxy_pass http://localhost:3000/api/pubkey/;
    }

    # Logging
    access_log /var/log/nginx/mirror.intra.access-$log_date.log combined;
    error_log /var/log/nginx/mirror.intra.error.log;
} 