server {
    listen 80;
    server_name cheatsheets.mirror.intra;
    
    add_header Access-Control-Allow-Origin *;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    proxy_connect_timeout 1800;
    proxy_send_timeout 1800;
    proxy_read_timeout 1800;
    send_timeout 1800;

    # Block admin routes (case-insensitive: React Router matches /Users as /users)
    location ~* ^/(login|logout|home|logs|documentation|file-manager|users|cheatsheets|npm|api/(resources|resolve-deps|upload-chunk|download-private))(\.data)?($|/|\?) {
        return 302 /;
    }

    # Search is the one costly public request: limit it per client. Matched
    # case-insensitively, as React Router matches /API/Cheatsheets/Search too.
    location ~* ^/api/cheatsheets/search {
        limit_req zone=cheatsheets_search burst=10 nodelay;
        limit_req_status 429;
        # Refusals show as 429 in the access log; keep them out of the error log.
        limit_req_log_level info;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Allow everything else (root, assets, api, etc.)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/cheatsheets.mirror.intra.access-$log_date.log combined;
    error_log /var/log/nginx/cheatsheets.mirror.intra.error.log;
}
