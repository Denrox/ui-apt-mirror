# NPM Registry Caching Proxy Configuration
# This configuration proxies npm requests to the admin app for caching

# npm tokens must not reach the access log, which every user can read on the Logs page: the
# token `npm logout` puts in the path, and anything that looks like a token (a JWT).
map $request $npm_log_request_1 {
    default                                                      $request;
    "~^(?<pre>\S+ /+(?:npm/+)?-/+user/+token/+)[^/\s?]+(?<post>.*)$"   "${pre}[redacted]${post}";
}
map $npm_log_request_1 $npm_log_request {
    default                                                       $npm_log_request_1;
    "~^(?<pre>.*?)eyJ[\w%.-]{17,}(?<post>(?:[^\w%.-].*)?)$"           "${pre}[redacted]${post}";
}
log_format npm_redacted '$remote_addr - $remote_user [$time_local] "$npm_log_request" '
                        '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name npm.mirror.intra;
    
    # Log npm requests to dedicated log file
    access_log /var/log/nginx/npm.mirror.intra.access-$log_date.log npm_redacted;
    error_log /var/log/nginx/npm.mirror.intra.error.log;

    add_header Access-Control-Allow-Origin *;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = / {
        add_header Access-Control-Allow-Origin *;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # npm logout (DELETE /-/user/token/<token>): the app ends the token. It gets the token in a
    # header, not in the path, so that the app's request log does not show it either; and
    # nginx's error log, which would show the request line, is off here.
    location ~ "^/(?:npm/)?-/user/token(?:/(?<npm_logout_token>[^/]*))?/?$" {
        error_log /dev/null;
        # Copied first: the rewrite's match replaces the location's captures.
        set $npm_revoke_token $npm_logout_token;
        rewrite ^ /npm/-/user/token/-? break;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Npm-Logout-Token $npm_revoke_token;
        proxy_read_timeout 30s;
    }

    # Proxy all requests to admin app npm endpoint
    location / {
        proxy_pass http://127.0.0.1:3000/npm/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Forward all headers from user
        proxy_pass_request_headers on;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-NPM-Auth-Token $http_x_npm_auth_token;
        proxy_set_header X-NPM-Session $http_x_npm_session;
        proxy_set_header X-NPM-Auth-Type $http_x_npm_auth_type;
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        
        # Handle large files
        client_max_body_size 100M;
        proxy_max_temp_file_size 0;
    }
}
