server {
    listen 80;
    server_name admin.mirror.intra;

    # Admin forms are small. Without a cap nginx spools any anonymous request body to disk
    # before the app can refuse it; file manager uploads get their own limit below.
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_connect_timeout 1800;
    proxy_send_timeout 1800;
    proxy_read_timeout 1800;
    send_timeout 1800;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Forwarded-Prefix /;

        # File manager uploads come in 10 MB chunks. The body is streamed, not spooled to
        # disk, so the app refuses an anonymous request before reading it.
        location = /api/upload-chunk {
            client_max_body_size 32m;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            proxy_pass http://127.0.0.1:3000;
        }
    }

    # Logging
    access_log /var/log/nginx/admin.mirror.intra.access-$log_date.log combined;
    error_log /var/log/nginx/admin.mirror.intra.error.log;
} 