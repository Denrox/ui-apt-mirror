# Uploaded files must not run as pages of this site: an HTML or SVG upload
# could otherwise script the other mirror hosts. PDFs are left alone, since
# browsers refuse to show a sandboxed PDF.
map $sent_http_content_type $files_downloads_csp {
    ~*^application/pdf "";
    default "sandbox";
}

server {
    listen 80;
    server_name files.mirror.intra;

    add_header Access-Control-Allow-Origin *;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    proxy_connect_timeout 1800;
    proxy_send_timeout 1800;
    proxy_read_timeout 1800;
    send_timeout 1800;

    location /downloads/ {
        alias /var/www/files/;
        # Never follow symlinks here: one could point at private files, /var/auth or /etc.
        disable_symlinks on;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        
        # Block access to files-private directory
        location ~ ^/downloads/files-private/ {
            deny all;
            return 403;
        }
        
        # Enable efficient streaming for large media files
        sendfile on;
        sendfile_max_chunk 1m;
        tcp_nopush on;
        tcp_nodelay on;
        
        # Enable range requests for seeking in videos
        add_header Accept-Ranges bytes;
        add_header Access-Control-Allow-Origin *;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy $files_downloads_csp always;
    }

    # Block admin routes (case-insensitive: React Router matches /Users as /users)
    location ~* ^/(login|logout|home|logs|documentation|cheatsheets|users|file-manager|npm|api/(resources|resolve-deps|upload-chunk|download-private))(\.data)?($|/|\?) {
        return 302 /;
    }

    # Allow everything else (root, assets, api, file-manager with query params, etc.)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/files.mirror.intra.access-$log_date.log combined;
    error_log /var/log/nginx/files.mirror.intra.error.log;
} 